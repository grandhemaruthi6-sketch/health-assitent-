name: Local OCR provider tests

on:
  pull_request:
    paths:
      - "server/services/ocr/**"
      - "server/utils/realDocumentExtractor.js"
      - "server/tests/localTesseractProvider.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/local-ocr-tests.yml"
  push:
    branches: [main]
    paths:
      - "server/services/ocr/**"
      - "server/utils/realDocumentExtractor.js"
      - "server/tests/localTesseractProvider.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/local-ocr-tests.yml"

jobs:
  local-ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run local OCR provider tests
        run: npm run test:local-ocr
