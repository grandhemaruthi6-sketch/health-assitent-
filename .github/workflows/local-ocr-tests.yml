name: Local OCR provider tests

on:
  pull_request:
    paths:
      - "server/services/ocr/**"
      - "server/services/clinical/clinicalParser.js"
      - "server/schemas/medicalDocumentSchema.js"
      - "server/services/clinical/medicalPipelineService.js"
      - "server/routes/medicalRecordRoutes.js"
      - "src/context/AppContext.jsx"
      - "src/screens/ExtractedReviewScreen.jsx"
      - "src/screens/ReportDetailsScreen.jsx"
      - "src/screens/SuccessReportScreen.jsx"
      - "src/services/apiClient.js"
      - "src/utils/medicalReportMapping.js"
      - "src/utils/medicalReportMapping.test.js"
      - "src/utils/reportFileUrl.js"
      - "src/utils/reportFileUrl.test.js"
      - "server/utils/realDocumentExtractor.js"
      - "server/schemas/medicalDocumentSchema.js"
      - "server/services/clinical/medicalPipelineService.js"
      - "server/routes/medicalRecordRoutes.js"
      - "src/context/AppContext.jsx"
      - "src/screens/ExtractedReviewScreen.jsx"
      - "src/screens/ReportDetailsScreen.jsx"
      - "src/screens/SuccessReportScreen.jsx"
      - "src/services/apiClient.js"
      - "src/utils/medicalReportMapping.js"
      - "src/utils/medicalReportMapping.test.js"
      - "src/utils/reportFileUrl.js"
      - "src/utils/reportFileUrl.test.js"
      - "server/tests/localTesseractProvider.test.js"
      - "server/tests/documentHeaderMetadata.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/local-ocr-tests.yml"
  push:
    branches: [main]
    paths:
      - "server/services/ocr/**"
      - "server/utils/realDocumentExtractor.js"
      - "server/tests/localTesseractProvider.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/local-ocr-tests.yml"

jobs:
  local-ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run local OCR provider tests
        run: npm run test:local-ocr && npm run test:header-metadata && npm run test:report-mapping && npm run test:report-file-url && node server/tests/clinicalPipeline.test.js && node server/tests/clinicalValueCorrectness.test.js && node server/tests/documentIsolationAndUrinalysis.test.js && node server/tests/multiDateCbcAndPersistence.test.js && npm run build
