<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HealthCopilot AI - Success State</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for HealthCopilot Theme -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              DEFAULT: '#009488',
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#009488',
              700: '#0f766e',
            },
            mint: '#0dbf7d',
            appBg: '#eef8fa'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 font-sans text-slate-800 antialiased">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Represents the iOS mobile screen format (375x812 aspect ratio) -->
<main class="w-full max-w-[375px] h-[780px] bg-[#f4fbfc] rounded-[44px] shadow-2xl overflow-hidden flex flex-col border-[6px] border-slate-900 relative">
<!-- BEGIN: iOSStatusBar -->
<!-- Native iOS-style status bar with time, dynamic island notch, and status icons -->
<header class="w-full pt-3 px-7 pb-2 flex justify-between items-center z-10 select-none" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-[14px] font-semibold tracking-tight text-slate-900">9:41</span>
<!-- Speaker Notch Bar -->
<div class="w-24 h-4 bg-slate-900 rounded-full mx-auto -mt-1 hidden sm:block"></div>
<!-- Right Status Indicators (Cellular, Wifi, Battery) -->
<div class="flex items-center space-x-1.5 text-slate-900">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3 fill-current" viewbox="0 0 16 12">
<rect height="3" rx="0.5" width="2.5" x="0" y="9"></rect>
<rect height="6" rx="0.5" width="2.5" x="4.5" y="6"></rect>
<rect height="9" rx="0.5" width="2.5" x="9" y="3"></rect>
<rect height="12" rx="0.5" width="2.5" x="13.5" y="0"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-3.5 h-3 fill-current" viewbox="0 0 16 12">
<path d="M8 2.8C5.2 2.8 2.7 3.9 0.8 5.7L0 4.8C2.1 2.8 5 1.5 8 1.5s5.9 1.3 8 3.3l-0.8 0.9C13.3 3.9 10.8 2.8 8 2.8z"></path>
<path d="M8 5.8c-1.9 0-3.6 0.8-4.9 2.1l-0.8-0.9C3.8 5.5 5.8 4.6 8 4.6s4.2 0.9 5.7 2.4l-0.8 0.9C11.6 6.6 9.9 5.8 8 5.8z"></path>
<circle cx="8" cy="10.5" r="1.3"></circle>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-slate-900 rounded-[3px] p-[1px] flex items-center relative">
<div class="h-full w-full bg-slate-900 rounded-[1.5px]"></div>
<div class="w-0.5 h-1 bg-slate-900 rounded-r absolute -right-1"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopBarTitle -->
<!-- State context header indicating Success State screen -->
<div class="w-full px-6 pt-2 pb-1" data-purpose="screen-title-banner">
<h2 class="text-xs font-semibold tracking-wider text-slate-500 uppercase">Success State</h2>
</div>
<!-- END: TopBarTitle -->
<!-- BEGIN: SuccessCardContainer -->
<!-- White card modal centered containing the success feedback and action -->
<section class="flex-1 flex flex-col justify-center px-5 pb-8" data-purpose="success-feedback-container">
<div class="bg-white rounded-3xl p-8 shadow-sm border border-cyan-50/80 flex flex-col items-center text-center">
<!-- BEGIN: SuccessIconBadge -->
<!-- Green circle with white animated/static checkmark icon -->
<div class="w-16 h-16 rounded-full bg-[#0dbf7d] flex items-center justify-center shadow-md shadow-emerald-500/20 mb-6 transition-transform hover:scale-105 duration-200" data-purpose="success-icon">
<svg class="w-8 h-8 text-white stroke-[3.5] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- END: SuccessIconBadge -->
<!-- BEGIN: SuccessTextContent -->
<!-- Main headline and explanatory subtext -->
<h1 class="text-[20px] font-bold text-slate-900 leading-snug mb-2">
          Report processed successfully!
        </h1>
<p class="text-[14px] text-slate-500 font-normal leading-relaxed mb-8">
          Your results are ready for review.
        </p>
<!-- END: SuccessTextContent -->
<!-- BEGIN: ActionButton -->
<!-- Primary action button to view extracted clinical results -->
<button class="w-full bg-[#009488] hover:bg-[#008277] active:scale-[0.98] transition-all duration-150 text-white font-medium text-[15px] py-3.5 px-6 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-[#009488]/40" data-purpose="view-results-button" type="button">
          View Results
        </button>
<!-- END: ActionButton -->
</div>
</section>
<!-- END: SuccessCardContainer -->
<!-- BEGIN: iOSHomeIndicator -->
<!-- Standard iOS bottom drag bar indicator -->
<footer class="w-full pb-2 pt-1 flex justify-center items-center select-none" data-purpose="ios-home-indicator">
<div class="w-32 h-1 bg-slate-300 rounded-full"></div>
</footer>
<!-- END: iOSHomeIndicator -->
</main>
<!-- END: MobileDeviceContainer -->
</body></html>
