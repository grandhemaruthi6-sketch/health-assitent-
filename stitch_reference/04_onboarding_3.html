<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>HealthCopilot AI - Onboarding 3/3</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for HealthCopilot Theme -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#009488',
              hover: '#007a70',
              light: '#E6F6F4'
            },
            secondary: '#00264C',
            accent: '#D5EFF0',
            appBg: '#F8FAFC'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          },
          boxShadow: {
            'soft': '0 10px 30px -5px rgba(0, 148, 136, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04)',
            'card': '0 20px 40px -15px rgba(0, 148, 136, 0.12)'
          }
        }
      }
    }
  </script>
<!-- Custom styles for iOS container framing and subtle UI polish -->
<style data-purpose="base-layout">
    body {
      background-color: #ECEFF1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .ios-device-container {
      max-width: 390px;
      min-height: 844px;
      height: 100vh;
      max-height: 844px;
    }
    @media (max-height: 850px) {
      .ios-device-container {
        height: 100vh;
        max-height: 100%;
      }
    }
  </style>
<style data-purpose="chart-decorations">
    .chart-glow {
      filter: drop-shadow(0 4px 10px rgba(0, 148, 136, 0.25));
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 select-none">
<!-- BEGIN: MobileContainer -->
<div class="ios-device-container w-full bg-white sm:rounded-[44px] shadow-2xl flex flex-col justify-between overflow-hidden relative border border-slate-100">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-20 shrink-0" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight text-slate-900">9:41</span>
<!-- Dynamic Island / Top Speaker Space (aesthetic spacer) -->
<div class="w-24 h-4 rounded-full"></div>
<!-- Status Icons -->
<div class="flex items-center space-x-2 text-slate-900">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<path d="M1 11h2.5V8.5H1V11zm4.5 0H8V6H5.5v5zm4.5 0h2.5V3.5H10V11zm4.5 0H17V1h-2.5v10z"></path>
</svg>
<!-- Wi-Fi -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.5C4.8 2.5 1.9 3.8 0 6l1.8 1.8C3.3 6.3 5.5 5.3 8 5.3s4.7 1 6.2 2.5L16 6C14.1 3.8 11.2 2.5 8 2.5zm0 5.6c-1.7 0-3.2.7-4.2 1.8L8 14.1l4.2-4.2C11.2 8.8 9.7 8.1 8 8.1z"></path>
</svg>
<!-- Battery -->
<div class="flex items-center">
<div class="w-5 h-2.5 border border-slate-900 rounded-sm p-0.5 flex items-center">
<div class="h-full w-3 bg-slate-900 rounded-2xs"></div>
</div>
<div class="w-0.5 h-1 bg-slate-900 rounded-r-xs ml-px"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: AppBrandHeader -->
<div class="flex items-center justify-center space-x-2 pt-3 pb-2" data-purpose="app-branding">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-white shadow-sm">
<!-- Heartbeat / ECG pulse icon -->
<svg class="w-3.5 h-3.5 stroke-current stroke-2 fill-none" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
</svg>
</div>
<span class="text-[17px] font-bold tracking-tight text-slate-800">HealthCopilot AI</span>
</div>
<!-- END: AppBrandHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex flex-col px-7 pt-4 justify-between" data-purpose="onboarding-step-3">
<!-- Heading & Description -->
<div class="text-left space-y-2.5">
<h1 class="text-[26px] font-extrabold text-slate-900 leading-tight tracking-tight">
          Track Your Health<br/>Over Time
        </h1>
<p class="text-[15px] font-normal text-slate-500 leading-relaxed pr-2">
          View your past reports, compare results and stay informed about your health journey.
        </p>
</div>
<!-- Illustration Area -->
<div class="relative w-full aspect-[4/3] my-auto flex items-center justify-center" data-purpose="illustration-card-container">
<!-- Ambient background aura -->
<div class="absolute w-56 h-56 rounded-full bg-[#EAF8F7] blur-2xl -z-10"></div>
<!-- Floating Card -->
<div class="w-full max-w-[280px] bg-white rounded-3xl p-5 shadow-card border border-teal-50 relative">
<!-- Card Header details -->
<div class="flex items-center justify-between pb-3 border-b border-slate-100">
<div class="flex items-center space-x-2">
<div class="w-7 h-7 rounded-lg bg-teal-50 flex items-center justify-center text-primary">
<!-- Activity / Trend icon -->
<svg class="w-4 h-4 stroke-current stroke-[2.2] fill-none" viewbox="0 0 24 24">
<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
</svg>
</div>
<span class="text-xs font-semibold text-slate-700">Hemoglobin Trend</span>
</div>
<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-600">
              +4.2%
            </span>
</div>
<!-- Line Chart Representation -->
<div class="mt-4 mb-2 relative">
<svg class="w-full h-28 overflow-visible chart-glow" fill="none" viewbox="0 0 200 100">
<defs>
<lineargradient id="chartGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#009488" stop-opacity="0.25"></stop>
<stop offset="100%" stop-color="#009488" stop-opacity="0.0"></stop>
</lineargradient>
</defs>
<!-- Subtle horizontal grid lines -->
<line stroke="#F1F5F9" stroke-dasharray="2 3" stroke-width="1" x1="0" x2="200" y1="20" y2="20"></line>
<line stroke="#F1F5F9" stroke-dasharray="2 3" stroke-width="1" x1="0" x2="200" y1="55" y2="55"></line>
<line stroke="#F1F5F9" stroke-dasharray="2 3" stroke-width="1" x1="0" x2="200" y1="90" y2="90"></line>
<!-- Area fill underneath the trend line -->
<path d="M 10 75 Q 50 65, 80 50 T 140 38 T 190 18 L 190 95 L 10 95 Z" fill="url(#chartGradient)"></path>
<!-- Trend Line -->
<path d="M 10 75 Q 50 65, 80 50 T 140 38 T 190 18" stroke="#009488" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5"></path>
<!-- Interactive / Data Indicator Dots -->
<circle cx="10" cy="75" fill="#FFFFFF" r="3.5" stroke="#009488" stroke-width="2"></circle>
<circle cx="80" cy="50" fill="#FFFFFF" r="3.5" stroke="#009488" stroke-width="2"></circle>
<circle cx="140" cy="38" fill="#FFFFFF" r="3.5" stroke="#009488" stroke-width="2"></circle>
<!-- Active Highlight Dot -->
<circle class="pulse-dot" cx="190" cy="18" fill="#009488" r="5" stroke="#FFFFFF" stroke-width="2.5"></circle>
</svg>
<!-- Tooltip Tag near last point -->
<div class="absolute -top-3 right-0 bg-slate-900 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm">
              13.2 g/dL
            </div>
</div>
<!-- Bottom timeline axis values -->
<div class="flex justify-between text-[10px] font-medium text-slate-400 pt-1 border-t border-slate-50">
<span>Dec</span>
<span>Feb</span>
<span>Apr</span>
<span class="text-primary font-bold">Latest</span>
</div>
<!-- Floating badge: Calendar icon -->
<div class="absolute -top-3.5 -left-3.5 w-9 h-9 rounded-xl bg-white shadow-md border border-slate-50 flex items-center justify-center text-primary">
<svg class="w-4 h-4 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect>
<line x1="16" x2="16" y1="2" y2="6"></line>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="3" x2="21" y1="10" y2="10"></line>
</svg>
</div>
<!-- Floating badge: Clock/History icon -->
<div class="absolute -bottom-3.5 -right-3.5 w-9 h-9 rounded-xl bg-white shadow-md border border-slate-50 flex items-center justify-center text-teal-600">
<svg class="w-4 h-4 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="10"></circle>
<polyline points="12 6 12 12 16 14"></polyline>
</svg>
</div>
</div>
</div>
<!-- Pagination Indicators (Screen 3 of 3 active) -->
<div class="flex items-center justify-center space-x-1.5 py-4" data-purpose="pagination-dots">
<span class="w-2 h-2 rounded-full bg-slate-200"></span>
<span class="w-2 h-2 rounded-full bg-slate-200"></span>
<span class="w-6 h-2 rounded-full bg-primary transition-all"></span>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: FooterActions -->
<footer class="px-7 pb-8 pt-1 flex flex-col items-center space-y-3 shrink-0" data-purpose="screen-navigation">
<!-- Primary Action: Get Started -->
<button class="w-full py-4 rounded-xl bg-primary text-white text-[16px] font-semibold tracking-wide shadow-md shadow-teal-700/20 active:scale-[0.98] transition-transform hover:bg-primary-hover focus:outline-none" type="button">
        Get Started
      </button>
<!-- Secondary Action: Skip -->
<button class="py-1 text-[14px] font-medium text-slate-400 hover:text-slate-600 active:text-slate-800 transition-colors" type="button">
        Skip
      </button>
<!-- iOS Home Indicator bar -->
<div class="pt-3">
<div class="w-32 h-1 bg-slate-900 rounded-full mx-auto opacity-80"></div>
</div>
</footer>
<!-- END: FooterActions -->
</div>
<!-- END: MobileContainer -->
</body></html>
