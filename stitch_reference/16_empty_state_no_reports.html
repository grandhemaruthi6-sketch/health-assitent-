<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>HealthCopilot AI - Empty State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#009688',
              tealDark: '#008477',
              tealLight: '#E0F2F1',
              lightBlue: '#E1F5FE',
              softBg: '#F8FAFC'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="app-shell">
    /* iOS specific styles and centering viewport layout */
    body {
      background-color: #F1F5F9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-container {
      width: 100%;
      max-width: 390px;
      height: 844px;
      background-color: #FFFFFF;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body class="p-0 sm:p-4">
<!-- BEGIN: MobileDeviceFrame -->
<main class="mobile-container rounded-none sm:rounded-[44px]" data-purpose="mobile-viewport">
<!-- BEGIN: StatusBar -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-10 select-none" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight text-slate-900">9:41</span>
<!-- Right Status Icons (Signal, Wifi, Battery) -->
<div class="flex items-center space-x-1.5 text-slate-900">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<path d="M1 9h2a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1v-1a1 1 0 0 1 1-1zm4-3h2a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm4-3h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm4-3h2a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V1a1 1 0 0 1 1-1z"></path>
</svg>
<!-- Wifi -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.5c2.9 0 5.6 1.2 7.5 3.1l1.5-1.5C14.7 1.8 11.5.5 8 .5S1.3 1.8.1 4.1l1.5 1.5C3.5 3.7 6.1 2.5 8 2.5zm0 4c1.8 0 3.5.7 4.7 2L14.2 7C12.6 5.4 10.4 4.5 8 4.5S3.4 5.4 1.8 7l1.5 1.5C4.5 7.2 6.2 6.5 8 6.5zm0 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"></path>
</svg>
<!-- Battery -->
<div class="w-6 h-3 border border-slate-900 rounded-[4px] p-0.5 flex items-center relative">
<div class="h-full w-full bg-slate-900 rounded-[2px]"></div>
<div class="w-0.5 h-1.5 bg-slate-900 absolute -right-1 top-0.5 rounded-r-[1px]"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: ScreenHeader -->
<section class="px-6 pt-5 pb-2 select-none" data-purpose="screen-title-section">
<h1 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Empty State</h1>
</section>
<!-- END: ScreenHeader -->
<!-- BEGIN: EmptyStateContent -->
<section class="flex-1 flex flex-col items-center justify-center px-8 text-center" data-purpose="empty-state-content">
<!-- Friendly Illustration: Medical Document & Clipboard -->
<div class="relative w-44 h-44 mb-8 flex items-center justify-center" data-purpose="illustration">
<!-- Soft Circular Glow Background -->
<div class="absolute inset-0 bg-blue-50/80 rounded-full scale-105"></div>
<div class="absolute w-32 h-32 bg-cyan-100/40 rounded-full blur-xl"></div>
<!-- Clipboard Graphic Container -->
<div class="relative z-10 w-28 h-36 bg-white rounded-2xl shadow-sm border-2 border-sky-200 flex flex-col items-center pt-5 px-3">
<!-- Clipboard Top Clip -->
<div class="absolute -top-3.5 w-12 h-6 bg-sky-100 border-2 border-sky-300 rounded-lg flex items-center justify-center">
<div class="w-4 h-1.5 bg-sky-400 rounded-full"></div>
</div>
<!-- Inner Document Content Lines -->
<div class="w-full space-y-2.5 mt-2">
<!-- Line 1: Short Header -->
<div class="w-2/5 h-2 bg-teal-400 rounded-full"></div>
<!-- Line 2 -->
<div class="w-full h-1.5 bg-sky-100 rounded-full"></div>
<!-- Line 3 -->
<div class="w-5/6 h-1.5 bg-sky-100 rounded-full"></div>
<!-- Line 4 -->
<div class="w-4/5 h-1.5 bg-sky-100 rounded-full"></div>
</div>
<!-- Cross / Heart Accent Stamp -->
<div class="mt-4 w-7 h-7 rounded-full bg-teal-50 border border-teal-200 flex items-center justify-center">
<svg class="w-4 h-4 text-teal-600" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
</div>
<!-- Heading -->
<h2 class="text-xl font-bold text-slate-800 tracking-tight mb-2">
        No reports yet
      </h2>
<!-- Subtitle -->
<p class="text-sm leading-relaxed text-slate-500 max-w-[270px] mb-8">
        Upload your first medical report to get started with AI-powered insights.
      </p>
<!-- Primary Action Button -->
<button class="w-full py-3.5 px-6 bg-[#00897B] hover:bg-[#00796B] active:scale-[0.98] transition-all text-white text-[15px] font-semibold rounded-xl shadow-md shadow-teal-700/10 cursor-pointer" data-purpose="upload-action-button" type="button">
        Upload Report
      </button>
</section>
<!-- END: EmptyStateContent -->
<!-- BEGIN: BottomNavigation -->
<nav class="w-full bg-white border-t border-slate-100 px-3 py-2 flex items-center justify-around z-20 select-none pb-5" data-purpose="bottom-tab-bar">
<!-- Home Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 py-1 px-3 group" data-purpose="nav-item" href="#">
<svg class="w-5 h-5 mb-1 group-hover:scale-105 transition-transform" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight">Home</span>
</a>
<!-- Reports Tab (Active/Selected context) -->
<a class="flex flex-col items-center justify-center text-[#00897B] py-1 px-3 group" data-purpose="nav-item-active" href="#">
<svg class="w-5 h-5 mb-1 group-hover:scale-105 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-semibold tracking-tight">Reports</span>
</a>
<!-- Assistant / Plus Central Tab -->
<a class="flex flex-col items-center justify-center -mt-3 group" data-purpose="nav-center-action" href="#">
<div class="w-11 h-11 rounded-full bg-[#00897B] text-white flex items-center justify-center shadow-md shadow-teal-700/20 group-hover:bg-[#00796B] group-active:scale-95 transition-all">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</a>
<!-- Timeline Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 py-1 px-3 group" data-purpose="nav-item" href="#">
<svg class="w-5 h-5 mb-1 group-hover:scale-105 transition-transform" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<path d="M12 7v5l3 3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight">Timeline</span>
</a>
<!-- Profile Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-600 py-1 px-3 group" data-purpose="nav-item" href="#">
<svg class="w-5 h-5 mb-1 group-hover:scale-105 transition-transform" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight">Profile</span>
</a>
</nav>
<!-- END: BottomNavigation -->
</main>
<!-- END: MobileDeviceFrame -->
</body></html>
