<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>HealthCopilot AI - Onboarding 1/3</title>
<!-- Load Tailwind CSS v3 with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#009488',
              'teal-dark': '#007b71',
              'teal-light': '#E6F6F4',
              'teal-mint': '#E8F7F5',
              dark: '#111827',
              gray: '#64748B',
              'light-bg': '#F7FAFC'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="custom-layout">
    /* Prevent selection and enable iOS smooth app feel */
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 0px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-[#EFF7FA] min-h-screen flex justify-center items-center font-sans antialiased text-slate-800 p-0 sm:p-4">
<!-- BEGIN: Mobile Device Canvas -->
<div class="w-full max-w-[393px] h-[852px] bg-white sm:rounded-[48px] shadow-2xl flex flex-col justify-between overflow-hidden relative border-0 sm:border-[8px] sm:border-slate-900/10">
<!-- BEGIN: Top Section (Status Bar & Brand Header) -->
<header class="w-full pt-2 px-7 flex flex-col z-10" data-purpose="header-section">
<!-- iOS Status Bar Simulation -->
<div class="w-full h-11 flex justify-between items-center text-xs font-semibold text-slate-900 tracking-tight" data-purpose="ios-status-bar">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Cellular signal -->
<svg class="w-4 h-3 fill-current" viewbox="0 0 17 11">
<rect height="3" rx="0.6" width="2.5" x="0" y="8"></rect>
<rect height="5.5" rx="0.6" width="2.5" x="4" y="5.5"></rect>
<rect height="8" rx="0.6" width="2.5" x="8" y="3"></rect>
<rect height="10.5" rx="0.6" width="2.5" x="12" y="0.5"></rect>
</svg>
<!-- Wifi -->
<svg class="w-3.5 h-3 fill-current" viewbox="0 0 16 12">
<path d="M8 2.8c2.6 0 4.9 1 6.7 2.7l1.3-1.3C13.8 2 11 1 8 1 5 1 2.2 2 0 4.2l1.3 1.3C3.1 3.8 5.4 2.8 8 2.8zm0 4c1.6 0 3 .6 4.1 1.6l1.3-1.3C12 5.7 10.1 5 8 5s-4 .7-5.4 2.1l1.3 1.3C5 7.4 6.4 6.8 8 6.8zm0 4c.9 0 1.6-.7 1.6-1.6 0-.9-.7-1.6-1.6-1.6s-1.6.7-1.6 1.6c0 .9.7 1.6 1.6 1.6z"></path>
</svg>
<!-- Battery -->
<div class="w-5 h-2.5 border border-slate-900 rounded-sm p-0.5 flex items-center relative">
<div class="h-full w-3.5 bg-slate-900 rounded-2xs"></div>
<div class="w-0.5 h-1 bg-slate-900 absolute -right-1 rounded-r-xs"></div>
</div>
</div>
</div>
<!-- App Brand Header -->
<div class="flex items-center justify-center space-x-2 pt-3 pb-1" data-purpose="app-branding">
<div class="w-5 h-5 rounded-full bg-[#009488] flex items-center justify-center shadow-xs">
<!-- Pulse wave line icon inside brand circle -->
<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
</svg>
</div>
<span class="text-sm font-semibold tracking-tight text-slate-800">HealthCopilot AI</span>
</div>
</header>
<!-- END: Top Section -->
<!-- BEGIN: Main Content Area -->
<main class="flex-1 flex flex-col px-7 pt-4 pb-2" data-purpose="main-onboarding-content">
<!-- Title & Description -->
<div class="text-center px-2" data-purpose="text-content">
<h1 class="text-[26px] leading-tight font-bold text-slate-900 tracking-tight">
          Your Lab Reports,<br/>In Simple Words
        </h1>
<p class="mt-3 text-[14px] leading-relaxed text-slate-500 font-normal max-w-[280px] mx-auto">
          Upload your medical reports and get clear, easy-to-understand insights powered by AI.
        </p>
</div>
<!-- Center Graphical Illustration -->
<div class="flex-1 flex items-center justify-center py-4" data-purpose="illustration-wrapper">
<div class="relative w-[270px] h-[240px] flex items-center justify-center">
<!-- Soft Background Ambient Glows -->
<div class="absolute w-52 h-52 bg-sky-100/70 rounded-full blur-2xl -top-4 -left-2 pointer-events-none"></div>
<div class="absolute w-44 h-44 bg-teal-100/60 rounded-full blur-xl -bottom-2 -right-2 pointer-events-none"></div>
<!-- Medical Report Document Card (Left Back) -->
<div class="absolute left-3 top-6 w-[124px] h-[162px] bg-white rounded-2xl shadow-lg border border-slate-100 p-3.5 flex flex-col justify-between transform -rotate-3 transition-transform hover:rotate-0 duration-300">
<!-- Document Header with mini-logo -->
<div class="flex items-center space-x-2 pb-1 border-b border-slate-100">
<div class="w-6 h-6 rounded-lg bg-teal-50 flex items-center justify-center">
<svg class="w-3.5 h-3.5 text-[#009488]" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
<polyline points="14 2 14 8 20 8"></polyline>
</svg>
</div>
<div class="space-y-1">
<div class="h-1.5 w-10 bg-slate-200 rounded-full"></div>
<div class="h-1 w-6 bg-slate-100 rounded-full"></div>
</div>
</div>
<!-- Medical Test Rows with Checkmarks -->
<div class="space-y-2.5 my-auto">
<!-- Item 1 -->
<div class="flex items-center justify-between">
<div class="space-y-1">
<div class="h-1.5 w-12 bg-slate-200 rounded-full"></div>
<div class="h-1 w-8 bg-slate-100 rounded-full"></div>
</div>
<div class="w-3.5 h-3.5 rounded-full bg-emerald-100 flex items-center justify-center">
<svg class="w-2 h-2 text-emerald-600 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>
</div>
<!-- Item 2 -->
<div class="flex items-center justify-between">
<div class="space-y-1">
<div class="h-1.5 w-10 bg-slate-200 rounded-full"></div>
<div class="h-1 w-6 bg-slate-100 rounded-full"></div>
</div>
<div class="w-3.5 h-3.5 rounded-full bg-emerald-100 flex items-center justify-center">
<svg class="w-2 h-2 text-emerald-600 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>
</div>
<!-- Item 3 -->
<div class="flex items-center justify-between">
<div class="space-y-1">
<div class="h-1.5 w-11 bg-slate-200 rounded-full"></div>
<div class="h-1 w-7 bg-slate-100 rounded-full"></div>
</div>
<div class="w-3.5 h-3.5 rounded-full bg-emerald-100 flex items-center justify-center">
<svg class="w-2 h-2 text-emerald-600 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>
</div>
</div>
<!-- Document Footer stamp -->
<div class="pt-1 flex justify-end">
<span class="text-[8px] font-semibold text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded-md">Normal</span>
</div>
</div>
<!-- Cute Friendly AI Robot Avatar (Right Front) -->
<div class="absolute right-4 bottom-5 w-[116px] h-[132px] flex flex-col items-center justify-center z-10 filter drop-shadow-lg">
<!-- Antenna -->
<div class="w-1.5 h-3 bg-slate-300 rounded-full relative -mb-0.5 flex flex-col items-center">
<div class="w-2.5 h-2.5 rounded-full bg-teal-400 absolute -top-1.5 animate-pulse shadow-sm"></div>
</div>
<!-- Head / Screen -->
<div class="w-[104px] h-[92px] bg-gradient-to-b from-[#253245] to-[#171F2C] rounded-[26px] p-2.5 flex flex-col justify-between items-center border-[3px] border-[#384960] shadow-inner relative overflow-hidden">
<!-- Subtle screen sheen reflection -->
<div class="absolute -top-6 -left-6 w-20 h-20 bg-white/5 rounded-full transform rotate-12 pointer-events-none"></div>
<!-- Top status bar inside bot face -->
<div class="w-full flex justify-between items-center px-1">
<div class="flex space-x-0.5">
<div class="w-1 h-1 rounded-full bg-teal-400/80"></div>
<div class="w-1 h-1 rounded-full bg-teal-400/40"></div>
</div>
<div class="text-[8px] font-mono text-teal-300/80">AI 2.0</div>
</div>
<!-- Robot Eyes (Glowing Teal Expression) -->
<div class="flex items-center justify-center space-x-3.5 my-auto">
<!-- Left Eye -->
<div class="w-4 h-5 bg-[#00E5CC] rounded-full flex items-center justify-center shadow-[0_0_10px_rgba(0,229,204,0.7)]">
<div class="w-1.5 h-2 bg-white rounded-full translate-x-0.5 -translate-y-0.5"></div>
</div>
<!-- Right Eye -->
<div class="w-4 h-5 bg-[#00E5CC] rounded-full flex items-center justify-center shadow-[0_0_10px_rgba(0,229,204,0.7)]">
<div class="w-1.5 h-2 bg-white rounded-full translate-x-0.5 -translate-y-0.5"></div>
</div>
</div>
<!-- Robot Smile -->
<div class="w-4 h-1 border-b-2 border-[#00E5CC] rounded-full mb-1"></div>
</div>
<!-- Floating Robot Collar / Base -->
<div class="w-12 h-3.5 bg-slate-300 rounded-full -mt-1 border border-slate-200 shadow-sm flex items-center justify-center">
<div class="w-6 h-1 bg-[#009488] rounded-full"></div>
</div>
</div>
<!-- Small Floating Sparkles/Dots -->
<div class="absolute top-2 right-12 w-2 h-2 rounded-full bg-teal-300 animate-ping opacity-60"></div>
<div class="absolute bottom-16 left-2 w-1.5 h-1.5 rounded-full bg-sky-400 opacity-70"></div>
</div>
</div>
</main>
<!-- END: Main Content Area -->
<!-- BEGIN: Footer Actions & Navigation -->
<footer class="w-full px-7 pb-8 pt-2 flex flex-col items-center safe-bottom" data-purpose="footer-controls">
<!-- Onboarding Step Indicator Dots (Screen 1 is active) -->
<div class="flex items-center justify-center space-x-1.5 mb-7" data-purpose="step-indicators">
<!-- Dot 1: Active Pill -->
<span class="w-6 h-1.5 bg-[#009488] rounded-full transition-all duration-300"></span>
<!-- Dot 2: Inactive Dot -->
<span class="w-1.5 h-1.5 bg-slate-200 rounded-full"></span>
<!-- Dot 3: Inactive Dot -->
<span class="w-1.5 h-1.5 bg-slate-200 rounded-full"></span>
</div>
<!-- Primary Action Button: Next -->
<button class="w-full h-12 bg-[#009488] hover:bg-[#007b71] active:scale-[0.99] text-white text-[15px] font-semibold rounded-full shadow-sm hover:shadow transition duration-150 ease-in-out flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-[#009488] focus:ring-offset-2" data-purpose="next-button" type="button">
        Next
      </button>
<!-- Tertiary Action Link: Skip -->
<button class="mt-3.5 py-1 px-4 text-xs font-medium text-slate-400 hover:text-slate-600 active:text-slate-700 transition-colors focus:outline-none" data-purpose="skip-link" type="button">
        Skip
      </button>
<!-- iOS Home Indicator bar -->
<div class="w-32 h-1 bg-slate-300 rounded-full mt-3 opacity-60" data-purpose="ios-home-indicator"></div>
</footer>
<!-- END: Footer Actions & Navigation -->
</div>
<!-- END: Mobile Device Canvas -->
</body></html>
