<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>HealthCopilot AI - Voice Assistant (Answer)</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#0D9488',    /* Teal Primary */
              darkTeal: '#0F766E',   /* Active/Hover Teal */
              lightTeal: '#E6F4F2',  /* Background soft tint */
              accent: '#38BDF8',     /* Assistant glow cyan */
              border: '#E2E8F0',
              textPrimary: '#0F172A',
              textSecondary: '#64748B'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 8px 30px -4px rgba(13, 148, 136, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04)',
            'bubble': '0 10px 25px -3px rgba(15, 23, 42, 0.06), 0 4px 6px -2px rgba(15, 23, 42, 0.02)',
            'glow': '0 0 40px 10px rgba(56, 189, 248, 0.22)'
          }
        }
      }
    }
  </script>
<!-- BEGIN: StyleSheets -->
<style data-purpose="custom-layout">
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #F1F5F9;
    }
    /* iOS simulated bezel wrapper styling */
    .ios-shell {
      max-width: 390px;
      height: 844px;
    }
  </style>
<style data-purpose="robot-animations">
    @keyframes gentlePulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }
    .pulse-glow {
      animation: gentlePulse 3s infinite ease-in-out;
    }
  </style>
<!-- END: StyleSheets -->
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 bg-slate-100 font-sans text-slate-800">
<!-- BEGIN: DeviceContainer -->
<!-- iPhone 14/15 Pro proportional frame container -->
<main class="ios-shell w-full bg-white sm:rounded-[48px] shadow-2xl relative overflow-hidden flex flex-col justify-between border border-slate-200" data-purpose="mobile-screen">
<!-- BEGIN: StatusBar -->
<!-- iOS Standard Dynamic Island / Top Header Status Area -->
<header class="w-full pt-3 px-7 pb-2 flex justify-between items-center z-20 text-slate-900 select-none" data-purpose="ios-status-bar">
<!-- Time Display -->
<span class="text-[15px] font-semibold tracking-tight">9:41</span>
<!-- Dynamic Island Pill placeholder -->
<div class="w-28 h-5 bg-black rounded-full hidden sm:block mx-auto -mt-1 shadow-inner"></div>
<!-- System Status Indicators -->
<div class="flex items-center space-x-2 text-slate-800">
<!-- Cellular Signal -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25A10.95 10.95 0 0 1 1 12C1 5.92 5.92 1 12 1s11 4.92 11 11c0 2.37-.75 4.57-2.02 6.36l-.62-.64A9.95 9.95 0 0 0 21 12c0-4.97-4.03-9-9-9z" opacity="0.3"></path>
<path d="M2 19h20v2H2z" opacity="0.3"></path>
<rect height="5" rx="1" width="3" x="2" y="16"></rect>
<rect height="8" rx="1" width="3" x="7" y="13"></rect>
<rect height="11" rx="1" width="3" x="12" y="10"></rect>
<rect height="14" rx="1" width="3" x="17" y="7"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A17.9 17.9 0 0 0 12 4zm0 3.32c3.78 0 7.23 1.48 9.8 3.91L12 19.08 2.2 11.23A14.28 14.28 0 0 1 12 7.32z"></path>
</svg>
<!-- Battery Status -->
<div class="w-6 h-3 border border-slate-800 rounded-sm p-0.5 flex items-center relative">
<div class="h-full w-full bg-slate-900 rounded-2xs"></div>
<div class="absolute -right-1 top-0.75 w-0.5 h-1.5 bg-slate-800 rounded-r-xs"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: ScreenNavigation -->
<nav class="w-full px-6 py-2 flex items-center justify-between" data-purpose="app-header">
<button aria-label="Go Back" class="w-9 h-9 flex items-center justify-center rounded-full bg-slate-50 text-slate-600 hover:bg-slate-100 transition-colors" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<polyline points="15 18 9 12 15 6"></polyline>
</svg>
</button>
<!-- Screen Identifier Badge matching snapshot title -->
<span class="text-xs font-semibold uppercase tracking-wider text-teal-800 bg-teal-50 px-3 py-1 rounded-full border border-teal-100/60">
        Voice Assistant (Answer)
      </span>
<button aria-label="Close Assistant" class="w-9 h-9 flex items-center justify-center rounded-full bg-slate-50 text-slate-600 hover:bg-slate-100 transition-colors" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<line x1="18" x2="6" y1="6" y2="18"></line>
<line x1="6" x2="18" y1="6" y2="18"></line>
</svg>
</button>
</nav>
<!-- END: ScreenNavigation -->
<!-- BEGIN: AssistantContentArea -->
<section class="flex-1 flex flex-col items-center justify-center px-6 -mt-6" data-purpose="voice-assistant-body">
<!-- Robot Avatar with Soft Circular Glow -->
<div class="relative flex items-center justify-center mb-8" data-purpose="avatar-container">
<!-- Multi-layered glowing ambient backdrops -->
<div class="absolute w-36 h-36 rounded-full bg-sky-200/50 blur-2xl pulse-glow"></div>
<div class="absolute w-28 h-28 rounded-full bg-teal-200/40 blur-xl"></div>
<div class="absolute w-24 h-24 rounded-full bg-sky-100/80"></div>
<!-- Robot Circular Head Badge -->
<div class="relative w-24 h-24 rounded-full bg-gradient-to-b from-[#40A9FF] to-[#0D9488] p-0.5 shadow-lg flex items-center justify-center">
<div class="w-full h-full rounded-full bg-[#1A73E8]/90 flex items-center justify-center relative overflow-hidden backdrop-blur-sm">
<!-- Subtle Robot Face Art -->
<!-- Antenna -->
<div class="absolute top-2 w-1.5 h-2 bg-sky-200 rounded-t-full"></div>
<!-- Visor Screen -->
<div class="w-14 h-10 bg-slate-900/90 rounded-2xl flex items-center justify-center space-x-2 border border-sky-400/30 shadow-inner">
<!-- Left Eye -->
<span class="w-2.5 h-3 bg-sky-400 rounded-full animate-pulse shadow-[0_0_8px_#38bdf8]"></span>
<!-- Right Eye -->
<span class="w-2.5 h-3 bg-sky-400 rounded-full animate-pulse shadow-[0_0_8px_#38bdf8]"></span>
</div>
<!-- Smile / Voice wave line under eyes -->
<div class="absolute bottom-3.5 w-6 h-1 bg-teal-300/80 rounded-full"></div>
</div>
</div>
</div>
<!-- Speech Response Bubble Card -->
<article class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-bubble border border-slate-100 text-left relative" data-purpose="assistant-response-bubble">
<!-- Message Heading -->
<h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wide mb-2.5 flex items-center">
<span class="w-2 h-2 rounded-full bg-teal-500 mr-2 inline-block"></span>
          Here's what I found...
        </h2>
<!-- Main Answer Body -->
<p class="text-slate-800 text-[17px] leading-relaxed font-normal">
          Your hemoglobin level is <strong class="font-bold text-slate-900">13.2 g/dL</strong>, which is within the <span class="text-teal-700 font-semibold bg-teal-50 px-1.5 py-0.5 rounded-md">normal range</span> <span class="text-slate-500 text-[15px]">(12.0 - 16.0 g/dL)</span>.
        </p>
<!-- Small speech arrow pointer decoration at top pointing towards avatar -->
<div class="absolute -top-2 left-1/2 -translate-x-1/2 w-4 h-4 bg-white rotate-45 border-l border-t border-slate-100"></div>
</article>
<!-- Waveform / Interactive Audio Listen Button -->
<div class="w-full max-w-sm mt-5" data-purpose="audio-playback-action">
<button aria-label="Listen to hemoglobin answer audio" class="w-full py-3.5 px-5 rounded-2xl bg-white border border-teal-200 text-teal-800 font-medium text-sm shadow-sm hover:bg-teal-50/50 active:scale-[0.98] transition-all flex items-center justify-center space-x-2.5 group" id="listen-audio-btn" type="button">
<!-- Speaker Audio Wave Icon -->
<svg class="w-5 h-5 text-teal-600 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
<path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
</svg>
<span class="font-semibold text-teal-800">Listen</span>
</button>
</div>
</section>
<!-- END: AssistantContentArea -->
<!-- BEGIN: BottomActionContainer -->
<footer class="w-full px-6 pt-4 pb-8 bg-white border-t border-slate-100 shadow-[0_-4px_20px_rgba(0,0,0,0.02)]" data-purpose="action-footer">
<!-- Continue confirmation button -->
<button class="w-full py-4 rounded-2xl bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white font-semibold text-base shadow-md shadow-teal-700/20 active:scale-[0.99] transition-all text-center flex items-center justify-center space-x-2" data-purpose="continue-button" type="button">
<span>Continue</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</button>
<!-- Home bar indicator for iOS standard styling -->
<div class="w-32 h-1 bg-slate-300 rounded-full mx-auto mt-6"></div>
</footer>
<!-- END: BottomActionContainer -->
</main>
<!-- END: DeviceContainer -->
<!-- BEGIN: InteractiveHandlers -->
<script data-purpose="audio-button-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const listenBtn = document.getElementById('listen-audio-btn');
      if (listenBtn) {
        listenBtn.addEventListener('click', () => {
          const isPlaying = listenBtn.getAttribute('data-playing') === 'true';
          const label = listenBtn.querySelector('span');
          
          if (!isPlaying) {
            listenBtn.setAttribute('data-playing', 'true');
            listenBtn.classList.add('bg-teal-50', 'border-teal-500');
            if (label) label.textContent = 'Playing...';
            
            // Revert after 3 seconds simulation
            setTimeout(() => {
              listenBtn.setAttribute('data-playing', 'false');
              listenBtn.classList.remove('bg-teal-50', 'border-teal-500');
              if (label) label.textContent = 'Listen';
            }, 3000);
          }
        });
      }
    });
  </script>
<!-- END: InteractiveHandlers -->
</body></html>
