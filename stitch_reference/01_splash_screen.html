<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HealthCopilot AI - Splash Screen</title>
<!-- Tailwind CSS CDN with forms and container plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#009488',
              'teal-dark': '#007A70',
              navy: '#0E1E38',
              gray: '#607088',
              ice: '#EEF8F8'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'San Francisco', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'sans-serif'],
          }
        }
      }
    };
  </script>
<!-- Custom Styles for Gradient Background & Micro-animations -->
<style data-purpose="custom-layout">
    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Screen background matching the soft light cyan subtle base from the UI Kit */
    .screen-bg {
      background: radial-gradient(circle at 50% 25%, #f4fbfb 0%, #e6f6f6 60%, #ddf2f2 100%);
    }

    /* Custom smooth circular loading spinner */
    .loader-ring {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(0, 148, 136, 0.18);
      border-top-color: #009488;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body class="p-0 sm:p-4">
<!-- BEGIN: PhoneFrame -->
<div class="relative w-full max-w-[390px] h-[844px] bg-white rounded-[44px] overflow-hidden shadow-2xl border-[7px] border-slate-900 flex flex-col justify-between select-none" data-purpose="ios-device-container">
<!-- BEGIN: BackgroundLayer -->
<div class="absolute inset-0 screen-bg pointer-events-none z-0">
<!-- Subtle wavy / ambient radial overlay -->
<div class="absolute -bottom-24 -left-20 w-96 h-96 rounded-full bg-teal-100/40 blur-3xl pointer-events-none"></div>
<div class="absolute -top-20 -right-20 w-80 h-80 rounded-full bg-cyan-100/40 blur-3xl pointer-events-none"></div>
</div>
<!-- END: BackgroundLayer -->
<!-- BEGIN: iOSStatusBar -->
<header class="relative z-10 w-full px-7 pt-3.5 pb-2 flex items-center justify-between text-slate-900 font-semibold text-[15px] tracking-tight" data-purpose="ios-status-bar">
<!-- Left: Status Bar Clock -->
<span class="pl-1 text-[15px] font-semibold tracking-normal text-slate-800">9:41</span>
<!-- Center: iPhone Dynamic Island / Speaker Notch area indicator -->
<div class="w-24 h-4 rounded-full bg-transparent"></div>
<!-- Right: iOS Icons (Signal, Wifi, Battery) -->
<div class="flex items-center space-x-2 text-slate-800">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<rect height="6" rx="1" width="3" x="2" y="16"></rect>
<rect height="10" rx="1" width="3" x="7" y="12"></rect>
<rect height="14" rx="1" width="3" x="12" y="8"></rect>
<rect height="18" rx="1" width="3" x="17" y="4"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.25c3.78 0 7.21 1.5 9.77 3.96L12 19.06 2.23 11.21C4.79 8.75 8.22 7.25 12 7.25z"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center">
<div class="w-5 h-[11px] border-[1.5px] border-slate-800 rounded-[3px] p-[1px] flex items-center">
<div class="h-full w-full bg-slate-800 rounded-[1px]"></div>
</div>
<div class="w-[1.5px] h-1 bg-slate-800 rounded-r-[1px] ml-[0.5px]"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: SplashContent -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center -mt-10 px-6" data-purpose="splash-branding-content">
<!-- Brand Logo Badge -->
<div class="relative mb-6" data-purpose="app-logo">
<!-- Pulse circular teal emblem -->
<div class="w-20 h-20 bg-brand-teal rounded-full flex items-center justify-center shadow-lg shadow-teal-500/25 ring-8 ring-white/60">
<!-- Lifeline / Heartbeat SVG Path -->
<svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.75" viewbox="0 0 40 40">
<path d="M4 20.5H12.5L16 11.5L22.5 28.5L27 16L29.5 20.5H36"></path>
</svg>
</div>
</div>
<!-- App Title -->
<h1 class="text-[25px] font-bold text-brand-navy tracking-tight text-center mb-2" data-purpose="app-title">
        HealthCopilot AI
      </h1>
<!-- App Subtitle -->
<p class="text-xs sm:text-[13px] text-brand-gray tracking-normal font-normal text-center" data-purpose="app-subtitle">
        Understand Your Health,
      </p>
<p class="text-xs sm:text-[13px] text-brand-gray tracking-normal font-normal text-center -mt-0.5">
        With Confidence.
      </p>
<!-- Circular Loading / Progress Indicator -->
<div class="mt-14 flex items-center justify-center" data-purpose="circular-loader">
<div class="loader-ring"></div>
</div>
</main>
<!-- END: SplashContent -->
<!-- BEGIN: iOSHomeIndicator -->
<footer class="relative z-10 pb-2.5 pt-1 flex justify-center items-center w-full" data-purpose="ios-home-indicator-area">
<!-- Rounded home bar indicator -->
<div class="w-32 h-1 bg-slate-400/60 rounded-full"></div>
</footer>
<!-- END: iOSHomeIndicator -->
</div>
<!-- END: PhoneFrame -->
</body></html>
