<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>HealthCopilot AI - Onboarding (2/3)</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for precise colors and fonts -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#009488',
              'teal-dark': '#007A70',
              'teal-light': '#E6F6F5',
              'teal-soft': '#BFEAE7',
              accent: '#3B82F6',
              bg: '#F8FAFC',
              text: '#1E293B',
              muted: '#64748B'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          },
          boxShadow: {
            'card': '0 10px 25px -5px rgba(0, 148, 136, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04)',
            'btn': '0 4px 14px 0 rgba(0, 148, 136, 0.35)'
          }
        }
      }
    }
  </script>
<!-- Custom Styles for clean mobile view containment and pulse rings -->
<style data-purpose="mobile-viewport">
    body {
      background-color: #F1F5F9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      height: 844px;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 44px;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(15, 23, 42, 0.06);
    }
  </style>
<style data-purpose="illustration-decorations">
    .concentric-ring-outer {
      background: radial-gradient(circle, rgba(204, 243, 241, 0.45) 0%, rgba(230, 248, 247, 0.25) 55%, rgba(255, 255, 255, 0) 72%);
    }
    .concentric-ring-mid {
      background: radial-gradient(circle, rgba(178, 237, 234, 0.55) 0%, rgba(204, 243, 241, 0.35) 60%, rgba(255, 255, 255, 0) 75%);
    }
  </style>
</head>
<body>
<!-- BEGIN: MobileContainer -->
<div class="mobile-frame" data-purpose="ios-device-container">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-20 shrink-0" data-purpose="ios-status-bar">
<!-- Time display -->
<span class="text-[15px] font-semibold tracking-tight text-slate-800">9:41</span>
<!-- Dynamic Island / Speaker Notch placeholder spacer -->
<div class="w-28 h-4"></div>
<!-- Status Icons (Cellular, WiFi, Battery) -->
<div class="flex items-center space-x-1.5 text-slate-800">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="3" rx="0.5" width="3" x="0" y="9"></rect>
<rect height="6" rx="0.5" width="3" x="4.5" y="6"></rect>
<rect height="9" rx="0.5" width="3" x="9" y="3"></rect>
<rect height="12" rx="0.5" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-3.5 fill-current ml-0.5" viewbox="0 0 16 12">
<path d="M8 2.5C10.7 2.5 13.1 3.6 14.8 5.4L16 4.1C13.9 2 11.1 0.8 8 0.8C4.9 0.8 2.1 2 0 4.1L1.2 5.4C2.9 3.6 5.3 2.5 8 2.5ZM8 6.5C9.6 6.5 11.1 7.2 12.1 8.3L13.3 7C12 5.6 10.1 4.7 8 4.7C5.9 4.7 4 5.6 2.7 7L3.9 8.3C4.9 7.2 6.4 6.5 8 6.5ZM8 10.5C8.8 10.5 9.5 11.2 9.5 12C9.5 12.8 8.8 13.5 8 13.5C7.2 13.5 6.5 12.8 6.5 12C6.5 11.2 7.2 10.5 8 10.5Z"></path>
</svg>
<!-- Battery Icon with standard iOS capsule design -->
<div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5 flex items-center ml-1">
<div class="h-full w-full bg-slate-800 rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: BrandHeader -->
<section class="w-full pt-4 pb-2 px-6 flex items-center justify-center space-x-2 z-10" data-purpose="app-branding">
<!-- Heartbeat AI Logo Icon -->
<div class="w-7 h-7 rounded-full bg-[#009488] flex items-center justify-center text-white shadow-sm">
<svg class="w-4 h-4 stroke-white stroke-[2.2] fill-none" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
</svg>
</div>
<!-- Brand Name -->
<span class="text-[17px] font-bold tracking-tight text-slate-800">HealthCopilot AI</span>
</section>
<!-- END: BrandHeader -->
<!-- BEGIN: ContentArea -->
<main class="flex-1 flex flex-col items-center justify-between px-7 pt-4 pb-8 z-10">
<!-- Header Copy (Title & Description) -->
<div class="text-center w-full max-w-xs mt-2" data-purpose="onboarding-text">
<h1 class="text-[26px] font-extrabold text-slate-900 tracking-tight leading-snug">
          Ask Questions<br/>Anytime
        </h1>
<p class="text-[14px] leading-relaxed text-slate-500 mt-2.5 font-normal px-2">
          Use voice or text to ask questions about your health reports.
        </p>
</div>
<!-- Central Visual / Graphic Illustration -->
<div class="relative w-full max-w-[310px] h-[310px] my-auto flex items-center justify-center" data-purpose="voice-query-illustration">
<!-- Large Outer Echo Wave Ring -->
<div class="absolute w-[300px] h-[300px] rounded-full border border-teal-100/70 concentric-ring-outer animate-pulse duration-1000"></div>
<!-- Medium Inner Echo Wave Ring -->
<div class="absolute w-[220px] h-[220px] rounded-full border border-teal-200/60 concentric-ring-mid"></div>
<!-- Inner Soft Ambient Ring -->
<div class="absolute w-[150px] h-[150px] rounded-full bg-[#D4F4F1]/60"></div>
<!-- Floating Decorative Left Bubble: Voice Card -->
<div class="absolute left-1 top-24 bg-white/95 backdrop-blur-sm border border-slate-100 shadow-md rounded-2xl p-2.5 flex items-center space-x-1.5 z-10 transform -rotate-3 hover:rotate-0 transition-transform">
<div class="w-2 h-2 rounded-full bg-[#009488]/80"></div>
<div class="flex space-x-0.5 items-center h-4 px-1">
<span class="w-0.5 h-2 bg-[#009488] rounded-full"></span>
<span class="w-0.5 h-3.5 bg-[#009488] rounded-full"></span>
<span class="w-0.5 h-1.5 bg-[#009488] rounded-full"></span>
<span class="w-0.5 h-3 bg-[#009488] rounded-full"></span>
</div>
</div>
<!-- Floating Decorative Right Top Bubble: Chat Bubble -->
<div class="absolute right-3 top-16 bg-white/95 backdrop-blur-sm border border-slate-100 shadow-md rounded-2xl px-3 py-2 flex flex-col space-y-1 z-10 transform rotate-3 hover:rotate-0 transition-transform">
<div class="w-10 h-1.5 bg-slate-200 rounded-full"></div>
<div class="w-6 h-1.5 bg-teal-200 rounded-full"></div>
</div>
<!-- Floating Decorative Right Bottom Card: Mini Prescription/Report Summary -->
<div class="absolute right-2 bottom-16 bg-white/95 backdrop-blur-sm border border-slate-100 shadow-md rounded-2xl p-2.5 flex items-center space-x-2 z-10 transform -rotate-2">
<div class="w-6 h-6 rounded-lg bg-teal-50 flex items-center justify-center">
<svg class="w-3.5 h-3.5 text-[#009488]" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
<polyline points="14 2 14 8 20 8"></polyline>
<line x1="16" x2="8" y1="13" y2="13"></line>
<line x1="16" x2="8" y1="17" y2="17"></line>
</svg>
</div>
<div class="space-y-1">
<div class="w-7 h-1 bg-slate-300 rounded-full"></div>
<div class="w-5 h-1 bg-teal-300 rounded-full"></div>
</div>
</div>
<!-- Floating Sparkle Elements -->
<div class="absolute left-8 bottom-20 text-[#009488]/40 text-lg">✦</div>
<div class="absolute right-12 top-6 text-teal-300 text-sm">✦</div>
<!-- Central Active Microphone Orb -->
<div class="relative w-24 h-24 rounded-full bg-gradient-to-tr from-[#008176] to-[#00A89B] shadow-lg shadow-teal-500/30 flex items-center justify-center z-10 cursor-pointer active:scale-95 transition-transform" data-purpose="voice-input-button">
<!-- iOS Voice Microphone Icon -->
<svg class="w-10 h-10 text-white fill-none stroke-white stroke-[1.8]" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
<line x1="12" x2="12" y1="19" y2="22"></line>
<line x1="8" x2="16" y1="22" y2="22"></line>
</svg>
</div>
</div>
<!-- Bottom Interactive Controls & Navigation -->
<footer class="w-full flex flex-col items-center space-y-5" data-purpose="navigation-controls">
<!-- Pagination Indicator Dots (2 of 3 Active) -->
<div class="flex items-center space-x-2" data-purpose="carousel-pagination">
<!-- Dot 1: Inactive -->
<span class="w-2 h-2 rounded-full bg-slate-200 transition-all"></span>
<!-- Dot 2: Active pill indicator -->
<span class="w-6 h-2 rounded-full bg-[#009488] transition-all"></span>
<!-- Dot 3: Inactive -->
<span class="w-2 h-2 rounded-full bg-slate-200 transition-all"></span>
</div>
<!-- Primary Action Button: Next -->
<button class="w-full h-12 bg-[#009488] hover:bg-[#007A70] active:bg-[#006A61] text-white text-[15px] font-semibold rounded-full shadow-btn transition-colors duration-150 flex items-center justify-center" data-purpose="next-button" type="button">
          Next
        </button>
<!-- Secondary Action Link: Skip -->
<button class="text-[14px] font-medium text-slate-400 hover:text-slate-600 transition-colors py-1" data-purpose="skip-button" type="button">
          Skip
        </button>
</footer>
</main>
<!-- END: ContentArea -->
<!-- BEGIN: iOSHomeIndicator -->
<div class="w-full pb-2 flex justify-center items-center shrink-0" data-purpose="home-indicator-container">
<div class="w-36 h-1 bg-slate-900/20 rounded-full"></div>
</div>
<!-- END: iOSHomeIndicator -->
</div>
<!-- END: MobileContainer -->
</body></html>
